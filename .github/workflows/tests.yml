name: Addon checks
on: [push, pull_request]
jobs:
  lua51:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y luajit lua5.1 ffmpeg python3
      - run: for file in *.lua Libs/*.lua tests/*.lua; do luac5.1 -p "$file" || exit; done
      - run: luajit tests/run.lua .
      - run: luajit tests/integration.lua .
      - run: luajit tests/accounts.lua .
      - run: luajit tests/identity_regressions.lua .
      - run: luajit tests/shared_cache.lua .
      - run: luajit tests/dashboard.lua .
      - run: luajit tests/chart_range.lua .
      - run: luajit tests/chart_scope.lua .
      - run: luajit tests/group.lua .
      - run: luajit tests/kill_lifecycle.lua .
      - run: luajit tests/death_policy.lua .
      - run: luajit tests/death_runtime.lua .
      - run: luajit tests/world_policy.lua .
      - run: luajit tests/nearby.lua .
      - run: luajit tests/sounds.lua .
      - run: luajit tests/sync_budget.lua .
      - run: luajit tests/identity.lua .
      - run: luajit tests/roster.lua .
      - run: luajit tests/targeting.lua .
      - run: luajit tests/party.lua .
      - run: luajit tests/report_diagnostics.lua .
      - run: python3 tests/media_gain.py .
